<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecd8">
  <title>Writy - Simple notes, your way</title>
  <link rel="icon" href="./writy.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #302d27;
      background: #f4ecd8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(ellipse at 50% 0%, #fff8e9 0, transparent 62%),
        #f4ecd8;
    }

    main {
      width: min(100%, 620px);
      padding: clamp(32px, 7vw, 64px);
      border: 1px solid #e3d8bd;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 70px rgba(71, 58, 31, 0.1);
      text-align: center;
    }

    .logo {
      width: 76px;
      height: 76px;
      margin-bottom: 18px;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #806b43;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.7rem, 10vw, 4rem);
      letter-spacing: -0.06em;
    }

    .description {
      max-width: 430px;
      margin: 18px auto 28px;
      color: #625c50;
      font-size: 1.08rem;
      line-height: 1.7;
    }

    .download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 25px;
      border: 1px solid #2e3b30;
      border-radius: 12px;
      background: #354739;
      color: #fffdf6;
      font-size: 1rem;
      font-weight: 650;
      text-decoration: none;
      transition: background 150ms ease, transform 150ms ease;
    }

    .download:hover {
      transform: translateY(-2px);
      background: #26382b;
    }

    .download:focus-visible {
      outline: 3px solid #b5c69c;
      outline-offset: 3px;
    }

    .requirements {
      margin: 13px 0 0;
      color: #756d60;
      font-size: 0.88rem;
    }

    .features {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-top: 34px;
    }

    .features span {
      padding: 8px 12px;
      border: 1px solid #e5dcc8;
      border-radius: 999px;
      background: #faf6ed;
      color: #5e584d;
      font-size: 0.86rem;
    }

    footer {
      margin-top: 32px;
      color: #857c6d;
      font-size: 0.85rem;
    }

    footer a {
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./writy.svg" alt="Writy logo">
    <p class="eyebrow">A quiet place for your thoughts</p>
    <h1>Writy</h1>
    <p class="description">
      Write, format, and keep your notes together in a calm, focused desktop app.
    </p>
    <a class="download" id="download" href="./dist/WritySetup.exe">
      Download for Windows
    </a>
    <p class="requirements">Windows 10 or later · 64-bit</p>
    <div class="features" aria-label="Writy features">
      <span>Rich text</span>
      <span>Light and dark themes</span>
      <span>Private notes</span>
    </div>
    <footer>
      <a href="https://github.com">View the project on GitHub</a>
    </footer>
  </main>
  <script>
    const host = window.location.hostname;
    if (host.endsWith(".github.io")) {
      const owner = host.slice(0, -".github.io".length);
      const pathParts = window.location.pathname.split("/").filter(Boolean);
      const repository = pathParts[0] || `${owner}.github.io`;
      document.getElementById("download").href =
        `https://github.com/${owner}/${repository}/releases/latest/download/WritySetup.exe`;
      document.querySelector("footer a").href =
        `https://github.com/${owner}/${repository}`;
    }
  </script>
</body>
</html>
